<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mic Drop requires macOS</title>
    <link rel="stylesheet" href="webpage.css" />
  </head>
  <body>
    <header class="nav">
      <div class="nav__inner">
        <span class="nav__logo">Mic Drop</span>
      </div>
    </header>
    <main class="main">
      <div class="container">
        <div class="content">
          <h1>Mic Drop is only available on macOS</h1>
          <p>
            This extension requires <a href="https://getmicdrop.com/">Mic Drop</a>, which is only
            available for macOS. Since you’re using
            <span id="os-name">a different operating system</span>, you won’t be able to use this
            extension and should remove it from your browser.
          </p>
        </div>
      </div>
    </main>
    <script src="unsupported.js"></script>
  </body>
</html>
